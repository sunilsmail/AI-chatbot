version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: ecommerce
    ports: ["5432:5432"]
    volumes: ["pg-data:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  auth-service:
    build: ./services/auth-service
    env_file: .env.example
    depends_on: [postgres, redis]
    ports: ["8001:8001"]
  order-service:
    build: ./services/order-service
    env_file: .env.example
    depends_on: [postgres, redis]
    ports: ["8002:8002"]
  policy-service:
    build: ./services/policy-service
    env_file: .env.example
    depends_on: [postgres]
    ports: ["8003:8003"]
  chat-service:
    build: ./services/chat-service
    env_file: .env.example
    depends_on: [redis, postgres, order-service, policy-service]
    ports: ["8004:8004"]
  notification-service:
    build: ./services/notification-service
    env_file: .env.example
    depends_on: [redis]
    ports: ["8005:8005"]
  api-gateway:
    build: ./services/api-gateway
    env_file: .env.example
    depends_on: [auth-service, order-service, policy-service, chat-service]
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    depends_on: [api-gateway]
    ports: ["5173:5173"]
volumes:
  pg-data:

apiVersion: apps/v1
kind: Deployment
metadata: {name: auth-service}
spec:
  replicas: 2
  selector: {matchLabels: {app: auth-service}}
  template:
    metadata: {labels: {app: auth-service}}
    spec:
      containers:
      - name: auth-service
        image: auth-service:latest
        ports: [{containerPort: 8001}]
        envFrom:
        - configMapRef: {name: ecommerce-config}
        - secretRef: {name: ecommerce-secrets}
---
apiVersion: v1
kind: Service
metadata: {name: auth-service}
spec:
  selector: {app: auth-service}
  ports: [{port: 8001, targetPort: 8001}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: auth-service-hpa}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: auth-service}
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}

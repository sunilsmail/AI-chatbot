apiVersion: apps/v1
kind: Deployment
metadata: {name: api-gateway}
spec:
  replicas: 2
  selector: {matchLabels: {app: api-gateway}}
  template:
    metadata: {labels: {app: api-gateway}}
    spec:
      containers:
      - name: api-gateway
        image: api-gateway:latest
        ports: [{containerPort: 8000}]
        envFrom:
        - configMapRef: {name: ecommerce-config}
        - secretRef: {name: ecommerce-secrets}
---
apiVersion: v1
kind: Service
metadata: {name: api-gateway}
spec:
  selector: {app: api-gateway}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: api-gateway-hpa}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api-gateway}
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
